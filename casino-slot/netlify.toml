[build]
  publish = "frontend"
  command = ""
  functions = "netlify/functions"

# Route all /api/* requests to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# Optional: clean URLs and default to professional index
[[redirects]]
  from = "/"
  to = "/index_professional.html"
  status = 200
